version: "1.0"

profile:
  base:
    name: qodana.recommended
  inspections:
    # Keep Java 9+ migration inspections disabled for Java 8-compatible source.
    - inspection: Java9CollectionFactory
      enabled: false
    - inspection: EnhancedSwitchMigration
      enabled: false
    - inspection: PatternVariableCanBeUsed
      enabled: false
    - inspection: ClassCanBeRecord
      enabled: false
