version: 2
updates:
  - package-ecosystem: maven
    directories:
      - /
      - /zmux
      - /zmux-http
      - /zmux-http3
      - /zmux-quic
      - /zmux-netty-test
      - /zmux-bench
    schedule:
      interval: weekly
    groups:
      netty:
        patterns:
          - 'io.netty:*'
      junit:
        patterns:
          - 'org.junit*'
      maven-plugins:
        patterns:
          - 'org.apache.maven.plugins:*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
