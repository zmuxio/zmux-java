name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      # The Maven wrapper pins the Maven version on every OS (.mvn/wrapper/maven-wrapper.properties).
      MVNW: ${{ matrix.os == 'windows-latest' && './mvnw.cmd' || './mvnw' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        java: [ 25 ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          check-latest: true
          cache: maven

      - name: Build and test
        run: $MVNW -B verify

      - name: Verify release profile build
        if: runner.os == 'Linux'
        run: $MVNW -B -Prelease -Dgpg.skip=true -DskipTests verify

  static-checks:
    name: Static checks (Error Prone, SpotBugs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
          check-latest: true
          cache: maven

      # Every Error Prone finding fails the compile (-Werror); the profile lists the checks turned off.
      - name: Error Prone
        run: ./mvnw -B -Perrorprone clean test-compile

      # Effort Max, threshold Low, with find-sec-bugs and sb-contrib; spotbugs-exclude.xml lists the exclusions.
      - name: SpotBugs
        run: ./mvnw -B -Pstatic-checks clean test-compile spotbugs:check

  interop:
    name: Interop (Go and Rust zmux, independent QMux peers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout zmux-java
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zmux-java

      - name: Checkout zmux-rs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zmuxio/zmux-rs
          path: zmux-rs

      - name: Checkout zmux-go
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zmuxio/zmux-go
          path: zmux-go

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: zmux-java/interop/qmux-go-peer/go.sum

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
          check-latest: true
          cache: maven
          cache-dependency-path: zmux-java/**/pom.xml

      - name: Run interop tests
        working-directory: zmux-java
        env:
          ZMUX_RS_ROOT: ${{ github.workspace }}/zmux-rs
          ZMUX_GO_ROOT: ${{ github.workspace }}/zmux-go
        run: tools/verify-interop.sh
