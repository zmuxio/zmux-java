name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [ 25 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Verify release profile build
        run: mvn -B -Prelease -Dgpg.skip=true -DskipTests verify

  interop:
    name: Interop (Go and Rust zmux, independent QMux peers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout zmux-java
        uses: actions/checkout@v7
        with:
          path: zmux-java

      - name: Checkout zmux-rs
        uses: actions/checkout@v7
        with:
          repository: zmuxio/zmux-rs
          path: zmux-rs

      - name: Checkout zmux-go
        uses: actions/checkout@v7
        with:
          repository: zmuxio/zmux-go
          path: zmux-go

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache-dependency-path: zmux-java/interop/qmux-go-peer/go.sum

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
          cache: maven
          cache-dependency-path: zmux-java/**/pom.xml

      - name: Run interop tests
        working-directory: zmux-java
        env:
          ZMUX_RS_ROOT: ${{ github.workspace }}/zmux-rs
          ZMUX_GO_ROOT: ${{ github.workspace }}/zmux-go
        run: tools/verify-interop.sh
