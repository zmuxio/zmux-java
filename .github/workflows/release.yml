name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
          cache: maven

      - name: Validate tag
        shell: bash
        run: |
          version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          tag="${GITHUB_REF_NAME}"
          if [[ "${version}" == *-SNAPSHOT ]]; then
            echo "Refusing to release SNAPSHOT version ${version}" >&2
            exit 1
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Maven version ${version} is not a X.Y.Z release version" >&2
            exit 1
          fi
          if [[ "${tag}" != "v${version}" ]]; then
            echo "Tag ${tag} does not match Maven version ${version}" >&2
            exit 1
          fi
          echo "JRELEASER_PROJECT_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Stage Maven artifacts
        run: |
          rm -rf target/staging-deploy
          mvn -B -Prelease -DskipTests deploy \
            -DaltDeploymentRepository=local::default::file://${{ github.workspace }}/target/staging-deploy

      - name: Publish with JReleaser
        uses: jreleaser/release-action@v2
        with:
          version: 1.23.0
          arguments: deploy
          setup-java: false
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_MAVENCENTRAL_STAGE: FULL
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Upload JReleaser output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-output
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
