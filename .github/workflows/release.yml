name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: 25
          cache: maven

      - name: Validate tag
        shell: bash
        run: |
          version="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          tag="${GITHUB_REF_NAME}"
          if [[ "${version}" == *-SNAPSHOT ]]; then
            echo "Refusing to release SNAPSHOT version ${version}" >&2
            exit 1
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Maven version ${version} is not a X.Y.Z release version" >&2
            exit 1
          fi
          if [[ "${tag}" != "v${version}" ]]; then
            echo "Tag ${tag} does not match Maven version ${version}" >&2
            exit 1
          fi
          echo "JRELEASER_PROJECT_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Stage Maven artifacts
        run: |
          rm -rf target/staging-deploy
          ./mvnw -B -Prelease -Dmaven.test.skip=true deploy \
            -DaltDeploymentRepository=local::file://${{ github.workspace }}/target/staging-deploy

      - name: Publish with JReleaser
        uses: jreleaser/release-action@90ac653bb9c79d11179e65d81499f3f34527dcd5 # 2.5.0
        with:
          version: 1.27.0
          arguments: deploy
          setup-java: false
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_MAVENCENTRAL_STAGE: FULL
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Upload JReleaser output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jreleaser-output
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
